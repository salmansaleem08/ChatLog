# Render Blueprint — connect repo in dashboard; free tier has no persistent disk.
#
# WhatsApp service: use runtime docker so Chromium + chromedriver are installed.
# dockerfilePath / dockerContext are relative to the repository root (see Render docs).

services:
  - type: web
    name: chatlog-whatsapp-service
    runtime: docker
    rootDir: whatsapp-service
    dockerfilePath: whatsapp-service/Dockerfile
    dockerContext: whatsapp-service
    healthCheckPath: /health
    # Dashboard env (never commit values):
    # CHATLOG_AUTOMATION_SECRET — same as Vercel
    # Optional WHATSAPP_SESSION_DIR — omit on free tier; app uses /tmp (sessions lost on restart)
    # Render sets RENDER=true automatically on their platform
